# prek (fast pre-commit) — https://github.com/j178/prek
# Hooks run the project's pinned tools via uv, so versions match CI exactly.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python]
        pass_filenames: true

      - id: pytest
        name: pytest
        entry: uv run python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
