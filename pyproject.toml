[project]
name = "lecode"
version = "0.1.0"
description = "A minimalist terminal AI coding agent (OpenRouter / OpenAI-compatible)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "prompt_toolkit==3.0.53",
    "rich==15.0.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "mcp==2.1.1",
    "typer==0.27.2",
]

[project.scripts]
lecode = "lecode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecode"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "needs_fd: requires the fd binary on PATH",
    "needs_rg: requires the ripgrep (rg) binary on PATH",
    "needs_rtk: requires the rtk binary on PATH",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
